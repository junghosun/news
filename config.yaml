# ---- Schedule-related settings (the run itself is set in the workflow file) ----
lookback_days: 10         # weekly run; 10 days gives a small overlap, de-duplicated by seen.json
news_window: 7d           # how far back Google News is searched (1d, 7d, ...)

# ---- Output limits ----
