# ---- Research context for choosing publications (from the project proposal) ----
interest_profile: |
  PRIMARY FOCUS (weight most heavily): the research project "After Victory:
  Governance Outcomes, Political Stability, and Institutional Reform in East and
  Southeast Asia". It asks what happens after an opposition party or alliance
  defeats a long-dominant (often autocratic or conservative) incumbent and takes
  office. Cases: Malaysia 2018-2022, the Philippines 1986-1992, Myanmar 2010-2021,
  South Korea 1987-2003, Japan 1993-94 and 2009-12, Taiwan 1996-2008.
  Three sets of outcomes: (1) governance, meaning whether new governments deliver
  security and economic governance, sustain growth, and how foreign policy changes;
  (2) political stability, meaning partisan polarisation, inter-party elite
  manoeuvring, defections and coalition collapse, mobilisation by the ex-ruling
  regime, and the role of the military; (3) institutional reform, meaning when
  election commissions are strengthened, judiciaries become independent and media
  institutions are empowered, and why governments hesitate to constrain their own
  executive power. Hypotheses: appointing ex-regime insider elites, persuading
  one's own supporters to moderate reform expectations, and reaching a modus
  vivendi with the military each improve outcomes. Methods: cross-country process
  tracing, event sequencing, archival and interview evidence. The project is framed
  against the older "democratic consolidation" literature, which focused on
  authoritarian reversal rather than the new government's own governance and reform.

  HIGHLY RELEVANT: regime turnover and opposition victory; opposition parties and
  coalitions before and after taking power; democratic consolidation and backsliding
  after turnover; governance and policy performance of post-authoritarian or
  post-dominant-party governments; civil-military relations and coups; executive
  power, executive constraints and institutional reform; election commissions,
  judicial independence and media freedom; elite defections, party switching and
  coalition instability; polarisation after turnover; transitional justice and the
  treatment of ex-incumbents; process tracing and comparative historical methods.
  Strong geographic relevance: Malaysia, the Philippines, Myanmar, South Korea,
  Japan, Taiwan, Singapore, and Southeast and East Asia generally. Comparable cases
  elsewhere (for example Zambia, Tunisia, Egypt, Latin America, post-communist
  Europe) are also valuable when they speak to the same questions.

  SECONDARY (lower weight): Korean politics and legislative behaviour, executive
  accountability, and quantitative or computational methods (network analysis,
  survival analysis, causal inference, text as data).

  LESS RELEVANT: normative theory, pure IR or security studies, American politics,
  and public opinion or political psychology work, unless it bears on regime
  turnover, opposition politics or democratic institutions in Asia or comparable
  contexts.

