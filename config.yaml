# ---- Research context for choosing news ----
news_focus: |
  The reader is a political scientist following East and Southeast Asian politics.
  The research focus is what happens after an opposition party or alliance replaces
  a long-dominant incumbent: governance performance of new governments, political
  stability (polarisation, elite defections, coalition collapse, the role of the
  military), and institutional reform (election commissions, judiciaries, media,
  limits on executive power). Prefer stories about government formation and
  collapse, coalition and party politics, defections, elections and electoral
  rules, executive-legislative conflict, judicial and prosecutorial reform,
  civil-military relations, the treatment of former leaders, and constitutional or
  institutional change. Prefer reported events over opinion pieces. Drop stories
  that are not politically significant: crime, accidents, disasters, entertainment,
  sport, lifestyle, local human-interest items, routine business news,
  advertisements and press releases.

# ---- Regions. `query` is the general political search; `extra_queries` are
#      research-themed searches whose results are merged into the same pool. ----
regions:
  - name: Korean Politics
    query: 한국 정치
    extra_queries:
      - 개헌 OR 검찰개혁 OR 사법개혁
      - 여야 대치 OR 탈당 OR 합당 국회
    hl: ko
    gl: KR
    ceid: KR:ko
  - name: Japanese Politics
    query: 日本 政治
    extra_queries:
      - 連立 OR 政権 OR 解散 総選挙
      - 政治改革 OR 憲法改正 OR 野党
    hl: ja
    gl: JP
    ceid: JP:ja
  - name: Malaysian Politics
    query: Malaysia politics
    extra_queries:
      - Malaysia coalition OR defection OR unity government
      - Malaysia Election Commission OR judiciary OR constitutional reform
    hl: en-MY
    gl: MY
    ceid: MY:en
  - name: Philippine Politics
    query: Philippine politics
    extra_queries:
      - Philippines Senate OR impeachment OR coalition politics
      - Philippines COMELEC OR judiciary OR military OR institutional reform
    hl: en-PH
    gl: PH
    ceid: PH:en
  - name: Taiwanese Politics
    query: 台灣 政治
    extra_queries:
      - 立法院 朝野協商 OR 修憲 OR 罷免
      - 司法改革 OR 中選會 OR 國軍 政治
    hl: zh-TW
    gl: TW
    ceid: TW:zh-Hant

